name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test (with coverage)
        run: swift test --enable-code-coverage
      # Coverage is best-effort: it must never fail the test job. On CI the
      # Xcode `xcrun llvm-cov` can be older than the Swift toolchain that wrote
      # the profile ("unsupported instrumentation profile format version"), so
      # we tolerate failure and simply skip the upload when export doesn't work.
      - name: Export coverage (lcov)
        continue-on-error: true
        run: |
          set +e
          bin=$(swift build --show-bin-path)
          xctest=$(find "$bin" -maxdepth 1 -name '*.xctest' | head -1)
          name=$(basename "$xctest" .xctest)
          xcrun llvm-cov export -format=lcov "$xctest/Contents/MacOS/$name" \
            -instr-profile "$bin/codecov/default.profdata" \
            -ignore-filename-regex='(Tests|\.build)' > coverage.lcov
          if [ $? -ne 0 ] || [ ! -s coverage.lcov ]; then
            echo "::warning::coverage export skipped (llvm-cov/profdata version mismatch on runner)"
            rm -f coverage.lcov
          else
            echo "Wrote coverage.lcov ($(wc -l < coverage.lcov) lines)"
          fi
      - name: Upload coverage to Codecov
        if: hashFiles('coverage.lcov') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        # Runs without --strict: warnings annotate the PR, only errors fail CI.
        run: swiftlint lint --reporter github-actions-logging
      - name: SwiftFormat (lint)
        # Pinned to a known release so the default ruleset can't drift under the
        # runner's Homebrew and fail the gate on already-formatted code.
        env:
          SWIFTFORMAT_VERSION: 0.61.1
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat-bin"
          bin="$(find "$RUNNER_TEMP/swiftformat-bin" -type f -name swiftformat | head -1)"
          chmod +x "$bin"
          "$bin" --version
          "$bin" Sources Tests --lint
