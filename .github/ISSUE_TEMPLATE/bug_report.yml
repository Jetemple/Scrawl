name: Bug report
description: Report a reproducible problem with Scrawl
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Scrawl. Please remove transcripts, recordings, credentials, and other private data before posting.

  - type: input
    id: version
    attributes:
      label: Scrawl version
      description: The version shown in About Scrawl.
      placeholder: 0.0.16
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Homebrew
        - Direct download
        - Built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reliably shows the problem.
      placeholder: |
        1. Open...
        2. Press...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact private text, audio paths, credentials, and personal information.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed transcripts, recordings, credentials, and other private data.
          required: true
